<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بطاقة قائمة قصة الحلى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --flour-white: #F5F1E8;
  --warm-wheat: #A58B67;
  --toasted: #6F6252;
  --deep-dough: #463D33;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #E5DFD3;
  font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif;
  color: var(--deep-dough);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}
.card-wrapper {
  background: var(--flour-white);
  width: 148mm;
  min-height: 210mm; /* A5 standard table stand size */
  padding: 14mm 12mm;
  border-radius: 4px;
  box-shadow: 0 20px 50px rgba(70,61,51,0.2);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  text-align: center;
  position: relative;
  border: 1px solid var(--warm-wheat);
}
.card-border {
  position: absolute;
  inset: 6mm;
  border: 1px solid rgba(165, 139, 103, 0.4);
  pointer-events: none;
}
.card-header {
  padding-top: 6mm;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.logo {
  max-width: 68mm;
  height: auto;
}
.tagline {
  font-family: 'Aref Ruqaa', serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--deep-dough);
  margin-top: 10px;
}
.subtag {
  font-size: 14.5px;
  font-weight: 400;
  color: var(--toasted);
  margin-top: 2px;
}
.qr-container {
  background: #FFFFFF;
  padding: 16px;
  border-radius: 4px;
  border: 1px solid rgba(165, 139, 103, 0.35);
  box-shadow: 0 8px 24px -12px rgba(70,61,51,0.15);
  margin: 12mm 0;
}
.qr-container img {
  width: 64mm;
  height: 64mm;
  display: block;
}
.url-text {
  font-family: 'Cormorant Garamond', Georgia, serif;
  direction: ltr;
  font-size: 13.5px;
  letter-spacing: 0.08em;
  color: var(--warm-wheat);
  font-weight: 600;
  margin-top: 8px;
}
.card-footer {
  padding-bottom: 6mm;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.footer-title {
  font-family: 'Aref Ruqaa', serif;
  font-size: 19px;
  color: var(--deep-dough);
}
.footer-en {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--warm-wheat);
  direction: ltr;
}
.print-bar {
  margin-bottom: 18px;
  display: flex;
  gap: 12px;
}
.btn-print {
  background: var(--deep-dough);
  color: var(--flour-white);
  border: 0;
  padding: 10px 24px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  border-radius: 4px;
  cursor: pointer;
  transition: opacity .2s;
}
.btn-print:hover { opacity: .9; }

@media print {
  body {
    background: none;
    padding: 0;
  }
  .print-bar { display: none; }
  .card-wrapper {
    box-shadow: none;
    border-radius: 0;
    width: 100%;
    min-height: 100vh;
    padding: 16mm 14mm;
  }
  @page {
    size: A5;
    margin: 0;
  }
}
</style>
</head>
<body>

<div class="print-bar">
  <button class="btn-print" onclick="window.print()">🖨️ طباعة بطاقة الطاولة (مقاس A5)</button>
</div>

<div class="card-wrapper">
  <div class="card-border"></div>
  
  <div class="card-header">
    <img src="images/logo.png" alt="قصة الحلى" class="logo">
    <h2 class="tagline">من الدقيق تبدأ الحكاية.</h2>
    <p class="subtag">امسح الرمز لاستعراض قائمة المعمول والبسبوسة</p>
  </div>

  <div class="qr-container">
    <img src="qr-menu.png" alt="رمز QR لقائمة قصة الحلى">
  </div>

  <div class="card-footer">
    <span class="footer-title">قصة الحلى</span>
  </div>
</div>

</body>
</html>
